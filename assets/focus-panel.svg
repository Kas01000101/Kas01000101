<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title">
  <title id="title">Current focus areas</title>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="190" rx="24" fill="#080D20"/>
  <path d="M35 30 H1165" stroke="url(#line)" stroke-opacity="0.45"/>
  <path d="M35 160 H1165" stroke="url(#line)" stroke-opacity="0.25"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(45 50)">
      <rect width="255" height="92" rx="18" fill="#151039" stroke="#8B5CF6" stroke-opacity="0.75"/>
      <circle cx="28" cy="28" r="7" fill="#A78BFA" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></circle>
      <text x="50" y="34" fill="#EDE9FE" font-size="18" font-weight="700">AI ENGINEERING</text>
      <text x="24" y="65" fill="#A7B0C7" font-size="13">intelligent systems · applied AI</text>
    </g>
    <g transform="translate(330 50)">
      <rect width="255" height="92" rx="18" fill="#0B1D32" stroke="#22D3EE" stroke-opacity="0.75"/>
      <circle cx="28" cy="28" r="7" fill="#22D3EE" filter="url(#glow)"><animate attributeName="opacity" values="1;.3;1" dur="2.3s" repeatCount="indefinite"/></circle>
      <text x="50" y="34" fill="#E6FCFF" font-size="18" font-weight="700">ROBOTICS</text>
      <text x="24" y="65" fill="#A7B0C7" font-size="13">autonomy · sensors · interaction</text>
    </g>
    <g transform="translate(615 50)">
      <rect width="255" height="92" rx="18" fill="#11163A" stroke="#A855F7" stroke-opacity="0.72"/>
      <circle cx="28" cy="28" r="7" fill="#C084FC" filter="url(#glow)"><animate attributeName="opacity" values=".4;1;.4" dur="1.7s" repeatCount="indefinite"/></circle>
      <text x="50" y="34" fill="#F3E8FF" font-size="18" font-weight="700">COMPUTER VISION</text>
      <text x="24" y="65" fill="#A7B0C7" font-size="13">perception · visual intelligence</text>
    </g>
    <g transform="translate(900 50)">
      <rect width="255" height="92" rx="18" fill="#092337" stroke="#06B6D4" stroke-opacity="0.72"/>
      <circle cx="28" cy="28" r="7" fill="#67E8F9" filter="url(#glow)"><animate attributeName="opacity" values="1;.35;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <text x="50" y="34" fill="#ECFEFF" font-size="16" font-weight="700">INTELLIGENT UI</text>
      <text x="24" y="65" fill="#A7B0C7" font-size="13">interactive · adaptive systems</text>
    </g>
  </g>
</svg>