<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
  <title id="title">Kas01000101 — AI Engineering and Robotics</title>
  <desc id="desc">Minimal animated purple and cyan futuristic profile banner</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090D1F"/>
      <stop offset="0.5" stop-color="#151035"/>
      <stop offset="1" stop-color="#071B29"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="leftGlow">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="210" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="210" fill="url(#bg)"/>
    <circle cx="180" cy="30" r="230" fill="url(#leftGlow)">
      <animate attributeName="cx" values="150;230;150" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="180" r="250" fill="url(#rightGlow)">
      <animate attributeName="cx" values="1050;960;1050" dur="10s" repeatCount="indefinite"/>
    </circle>

    <path d="M100 44 H1100" stroke="url(#neon)" stroke-width="1" opacity="0.35" stroke-dasharray="3 12">
      <animate attributeName="stroke-dashoffset" values="0;-60" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M100 166 H1100" stroke="url(#neon)" stroke-width="1" opacity="0.22"/>

    <circle cx="165" cy="44" r="2.5" fill="#A78BFA" filter="url(#glow)">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1035" cy="166" r="2.5" fill="#22D3EE" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.7s" repeatCount="indefinite"/>
    </circle>

    <text x="600" y="102" text-anchor="middle" fill="url(#neon)" filter="url(#glow)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="47" font-weight="800" letter-spacing="1">Kas01000101</text>
    <text x="600" y="136" text-anchor="middle" fill="#E8ECFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="2">AI ENGINEERING  •  ROBOTICS</text>
  </g>
</svg>