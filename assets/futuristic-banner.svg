<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Kas01000101 — AI Engineering and Robotics</title>
  <desc id="desc">Animated futuristic purple and cyan profile banner</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B1B"/>
      <stop offset="0.45" stop-color="#14113A"/>
      <stop offset="1" stop-color="#071C2B"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#22D3EE"/>
      <animate attributeName="x1" values="0;0.25;0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0.75;1" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orbPurple">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCyan">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#8B5CF6" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="clip"><rect width="1200" height="320" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)">
      <animateTransform attributeName="transform" type="translate" values="0 0;42 42" dur="10s" repeatCount="indefinite"/>
    </rect>

    <circle cx="175" cy="65" r="230" fill="url(#orbPurple)" filter="url(#softGlow)">
      <animate attributeName="cx" values="150;260;150" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;120;70" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="245" r="255" fill="url(#orbCyan)" filter="url(#softGlow)">
      <animate attributeName="cx" values="1040;900;1040" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="245;170;245" dur="8s" repeatCount="indefinite"/>
    </circle>

    <g stroke="url(#neon)" stroke-opacity="0.7" fill="none">
      <path d="M40 250 C190 210 255 300 400 250 S640 190 775 240 S1000 300 1160 215" stroke-width="1.6">
        <animate attributeName="stroke-dasharray" values="2 18;18 2;2 18" dur="6s" repeatCount="indefinite"/>
      </path>
      <path d="M60 77 C200 120 310 40 445 80 S680 130 810 75 S1020 45 1140 95" stroke-width="1.2" opacity="0.5">
        <animate attributeName="stroke-dashoffset" values="0;80" dur="5s" repeatCount="indefinite"/>
      </path>
    </g>

    <g fill="#22D3EE" filter="url(#glow)">
      <circle cx="130" cy="230" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="92" r="3"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="250" r="2.5"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.6s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#C084FC" filter="url(#glow)">
      <circle cx="245" cy="92" r="2.8"><animate attributeName="opacity" values="1;0.25;1" dur="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="200" r="2.5"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" repeatCount="indefinite"/></circle>
    </g>

    <rect x="86" y="55" width="1028" height="210" rx="24" fill="#0B1025" fill-opacity="0.46" stroke="url(#neon)" stroke-opacity="0.62"/>
    <rect x="112" y="78" width="112" height="29" rx="14.5" fill="#8B5CF6" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.65"/>
    <text x="168" y="98" text-anchor="middle" fill="#D8B4FE" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.2">SYSTEM://ONLINE</text>

    <text x="600" y="162" text-anchor="middle" fill="url(#neon)" filter="url(#glow)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="1.2">Kas01000101</text>
    <text x="600" y="203" text-anchor="middle" fill="#E6ECFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="2.2">AI ENGINEERING  •  ROBOTICS</text>
    <text x="600" y="235" text-anchor="middle" fill="#8EDCF0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.4">perceive → reason → interact → act</text>
  </g>
</svg>